
name: Build Kids Home Reborn APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719

      - name: Instalar componentes do Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verificar e extrair projeto
        run: |
          unzip -q KidsHomeReborn_project.zip -d project
          test -f project/KidsHomeReborn/gradlew
          test -f project/KidsHomeReborn/app/build.gradle.kts

      - name: Compilar APK
        run: |
          cd project/KidsHomeReborn
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: KidsHomeReborn-debug
          path: project/KidsHomeReborn/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
