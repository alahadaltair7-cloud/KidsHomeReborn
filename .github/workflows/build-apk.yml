
name: Build Kids Home Reborn APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          unzip -q KidsHomeReborn_project.zip -d project
          cd project/KidsHomeReborn
          bash gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KidsHomeReborn-debug
          path: project/KidsHomeReborn/app/build/outputs/apk/debug/app-debug.apk
