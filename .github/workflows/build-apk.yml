
name: Build Kids Home Reborn APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair o projeto
        run: |
          unzip -q KidsHomeReborn_project.zip -d project
          test -f project/KidsHomeReborn/gradlew

      - name: Compilar APK
        run: |
          cd project/KidsHomeReborn
          bash gradlew :app:assembleDebug

      - name: Disponibilizar o APK
        uses: actions/upload-artifact@v4
        with:
          name: KidsHomeReborn-debug
          path: project/KidsHomeReborn/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
