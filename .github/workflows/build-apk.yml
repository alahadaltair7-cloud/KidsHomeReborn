
name: Build Kids Home Reborn APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      


      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar e extrair projeto
        run: |
          unzip -q KidsHomeReborn_project.zip -d project
          test -f project/KidsHomeReborn/app/build.gradle.kts
      - name: Corrigir compatibilidade JVM
        run: |
          sed -i '/^android {/a\    kotlinOptions { jvmTarget = "1.8" }' project/KidsHomeReborn/app/build.gradle.kts
      - name: Compilar APK         
        run: |
          cd project/KidsHomeReborn
          gradle --no-daemon :app:assembleDebug

      

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: KidsHomeReborn-debug
          path: project/KidsHomeReborn/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
