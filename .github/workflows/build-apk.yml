
name: Build Kids Home Reborn APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12.0

      - name: Verificar e extrair o projeto
        run: |
          echo "Arquivos na raiz:"
          ls -lah
          echo "Verificando ZIP:"
          unzip -t KidsHomeReborn_project.zip
          mkdir -p project
          unzip KidsHomeReborn_project.zip -d project
          echo "Procurando gradlew:"
          find project -name gradlew -type f
          test -f project/KidsHomeReborn/gradlew

      - name: Compilar APK
        run: |
          cd project/KidsHomeReborn
          bash gradlew :app:assembleDebug

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KidsHomeReborn-debug
          path: project/KidsHomeReborn/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
