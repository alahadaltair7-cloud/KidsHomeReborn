name: Build Kids Home Reborn APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'KidsHomeReborn_project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack project
        run: unzip -q KidsHomeReborn_project.zip -d source

      - name: Build debug APK
        working-directory: source/KidsHomeReborn
        run: |
          gradle --version
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KidsHomeReborn-debug-apk
          path: source/KidsHomeReborn/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
